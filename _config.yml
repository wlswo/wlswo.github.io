# ---------------------------------------------------------------
# Site Settings
# ---------------------------------------------------------------
title: Ephemeris
subtitle: 
description: JaeJin의 기술 블로그 - 개발, 컴퓨터 과학, 소프트웨어 엔지니어링에 대한 글을 씁니다.
author: JaeJin
language: ko
email: 
url: "https://wlswo.me"
baseurl: ""

# ---------------------------------------------------------------
# Build Settings
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

# Pagination
paginate: 20
paginate_path: "/page:num/"
permalink: /:year/:month/:day/:title/

# Plugins
plugins:
  - jemoji
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# ---------------------------------------------------------------
# Exclude
# ---------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - Rakefile
  - changelog.md
  - README_en.md

