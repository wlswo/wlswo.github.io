# ---------------------------------------------------------------
# Site Settings
# ---------------------------------------------------------------
title: Ephemeris
subtitle: 
# 링크를 공유할 때 나오는 설명(글은 각 글의 description 이 앞선다)
description: Blog
author: JaeJin
language: ko
email: 
url: "https://wlswo.me"
baseurl: ""

# ---------------------------------------------------------------
# Build Settings
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

permalink: /:year/:month/:day/:title/

# 글의 날짜와 주소를 한국 시간으로 셈한다. 이 줄이 없으면 GitHub Pages(UTC)에서
# 새벽 0~9시에 쓴 글의 주소가 하루 앞 날짜로 만들어진다.
timezone: Asia/Seoul

# Plugins
plugins:
  - jemoji
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from # 주소가 바뀐 글의 옛 주소(redirect_from)를 새 주소로 넘긴다

# ---------------------------------------------------------------
# Exclude
# ---------------------------------------------------------------
exclude:
  - tools # 공유 썸네일을 만드는 스크립트(tools/og). 사이트에 올리지 않는다
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - Rakefile
  - changelog.md
  - README_en.md

# ---------------------------------------------------------------
# Custom Settings
# ---------------------------------------------------------------
# 데스크톱 배경화면. 다른 그림을 쓰려면 assets/images/ 에 넣고 경로를 바꾼다.
# wallpaper_2x 는 레티나 화면용(없으면 wallpaper 를 그대로 쓴다).
# wallpaper_dark(_2x) 는 다크 모양일 때의 그림(없으면 위의 그림을 쓴다).
# wallpaper_tone 은 그림의 밝기: dark 면 라이트 모양에서도 메뉴 막대와 데스크톱
# 폴더 이름을 흰 글자로 쓴다(맥이 어두운 배경화면 위에서 하듯이).
#
# 직접 그린 밝은 배경(assets/images/wallpaper*.webp, 원본은 wallpaper.svg)도 남겨 두었다.
# 되돌리려면 아래 네 줄을 wallpaper(-dark)(@2x).webp 로 바꾸고 tone 을 light 로.
wallpaper: /assets/images/wallpaper-monterey.webp
wallpaper_2x: /assets/images/wallpaper-monterey@2x.webp
wallpaper_dark: /assets/images/wallpaper-monterey.webp
wallpaper_dark_2x: /assets/images/wallpaper-monterey@2x.webp
wallpaper_tone: light
# 그림 대신 단색으로 칠하려면 색을 적는다(지우면 위의 그림으로 돌아간다).
# 색이 어두우면 wallpaper_tone 을 dark, 밝으면 light 로 맞춘다.
wallpaper_color: "#d3d9b3"
# 배경화면을 크기 제각각의 칸으로 나누고 칸마다 리눅스 명령어를 적는다(assets/js/wallgrid.js).
wallpaper_grid: true
