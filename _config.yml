# ===============================================================
# A Jekyll blog that looks and works like a macOS desktop.
#
# Everything personal is set here and in _data/ — the code reads it from there:
#   _config.yml           site info, wallpaper, and the `desktop:` block at the bottom
#   _data/about_me.yml    the pinned "about me" note (Notes app, About.txt on the desktop)
#   _data/categories.yml  post categories (Finder tags, Obsidian folders, Calendar colors)
#   _data/projects.yml    your projects, shown as apps in the Games window
#   _data/music.yml       the album the Spotify app plays
#
# `jekyll serve` does not reload this file while it runs: restart it after editing.
# ===============================================================

# ---------------------------------------------------------------
# Site Settings
# ---------------------------------------------------------------
# Blog name: browser tab, About This Mac, System Settings, Mail, Obsidian vault,
# Calendar, Terminal (uname · neofetch)
title: Ephemeris
# Optional. Added to the home page's tab title ("title - subtitle")
subtitle:
# Description for search engines and link previews (a post's own description wins)
description: Blog
# Your name: lock screen, About This Mac, System Settings, Mail, © line
author: JaeJin
# Language of the page (<html lang>)
language: en
# Where the Mail app sends visitors' messages (opens their mail app with this address)
email: byunjin11@naver.com
# The site's address, without a trailing slash. Also used for feed/sitemap/SEO links and
# shown in Terminal (neofetch) and the Linux-commands wallpaper.
url: "https://wlswo.me"
# Sub-path when the site does not live at the domain root, e.g. "/blog" for
# username.github.io/blog. Leave "" for username.github.io or a custom domain.
baseurl: ""

# ---------------------------------------------------------------
# Build Settings
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

permalink: /:year/:month/:day/:title/

# Your time zone (IANA name, e.g. America/New_York). Post dates and URLs are counted
# in it; without it GitHub Pages builds in UTC, so a post written early in the day
# can get the previous day's URL.
# 글의 날짜와 주소를 한국 시간으로 셈한다. 이 줄이 없으면 GitHub Pages(UTC)에서
# 새벽 0~9시에 쓴 글의 주소가 하루 앞 날짜로 만들어진다.
timezone: Asia/Seoul

# Plugins
plugins:
  - jemoji
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from # 주소가 바뀐 글의 옛 주소(redirect_from)를 새 주소로 넘긴다

# ---------------------------------------------------------------
# Exclude
# ---------------------------------------------------------------
exclude:
  - tools # 공유 썸네일을 만드는 스크립트(tools/og). 사이트에 올리지 않는다
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - README.ko.md
  - NOTICE.md

# ---------------------------------------------------------------
# Wallpaper — the default desktop and lock-screen background
# (visitors can pick another one in System Settings › Wallpaper)
# ---------------------------------------------------------------
# To use your own picture, put it in assets/images/ and change the paths.
#   wallpaper          the picture
#   wallpaper_2x       a double-size copy for Retina screens (optional; falls back to wallpaper)
#   wallpaper_dark     the picture in Dark appearance (optional; falls back to wallpaper)
#   wallpaper_dark_2x  its Retina copy (optional)
#   wallpaper_tone     how bright the picture is. dark: menu bar text and desktop icon
#                      labels turn white even in Light appearance (as macOS does on a
#                      dark wallpaper). light: they stay black.
#
# A hand-drawn light wallpaper is included too (assets/images/wallpaper*.webp, source
# wallpaper.svg). To use it, point the four paths at wallpaper(-dark)(@2x).webp and set
# wallpaper_tone to light.
wallpaper: /assets/images/wallpaper-monterey.webp
wallpaper_2x: /assets/images/wallpaper-monterey@2x.webp
wallpaper_dark: /assets/images/wallpaper-monterey.webp
wallpaper_dark_2x: /assets/images/wallpaper-monterey@2x.webp
wallpaper_tone: dark
# Paint the desktop one solid color instead of a picture (remove the line to go back).
# Set wallpaper_tone to dark for a dark color, light for a light one.
# wallpaper_color: "#d3d9b3"
# Cover the wallpaper with a grid of Linux commands in cells of mixed sizes
# (assets/js/wallgrid.js); a play button in the menu bar types them out.
# wallpaper_grid: true

# ---------------------------------------------------------------
# Desktop — what the macOS desktop shows (Terminal, menu bar, widgets, apps)
# ---------------------------------------------------------------
desktop:
  # Terminal: the prompt (username@hostname), whoami and the home folder /Users/<username>.
  # Also the user in the Linux-commands wallpaper.
  username: wlswo
  # Terminal: the computer name in the prompt, hostname and uname -a
  hostname: Ephemeris
  # Wi-Fi network shown as connected (menu bar, Control Center, System Settings).
  # A name ending in -5G also lists its 2.4 GHz twin (the same name without -5G).
  wifi: Ephemeris-5G
  # Weather widget on the desktop, from Open-Meteo (free, no API key).
  # city is the label; latitude/longitude pick the forecast (look them up on any map).
  weather:
    city: Seoul
    latitude: 37.5665
    longitude: 126.978
  # Notification Center's crypto widget (click the clock): Coinbase product ids
  # (COIN-CURRENCY, e.g. BTC-USD, SOL-EUR), up to two. [] hides the widget.
  coins: [BTC-USD, ETH-USD]
  # The "Category" row of About This Mac. Remove the line to hide the row.
  about_category: Computer Science
  # Apache Druid, an illustrated explainer app (/druid/) on the desktop. false removes it
  # from the desktop, Finder, Spotlight and Terminal (the /druid/ page itself still builds;
  # delete druid/ and assets/druid/ to drop it entirely).
  druid: true
