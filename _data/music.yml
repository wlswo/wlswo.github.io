# Music — the album the Spotify app in the Dock plays (assets/js/music.js).
#
# Sound comes from YouTube through its official embed player, one video per track,
# played in order from the first track to the last.
#
# album
#   title   album name
#   artist  main artist (shown under every track title)
#   year    release year
#   art     cover image URL (a square image, about 600×600). Leave empty to show the Spotify icon.
#
# tracks (in play order)
#   id      YouTube video id: the part after "watch?v=" in a video URL, e.g.
#           https://www.youtube.com/watch?v=WxflcXmtVTM  ->  WxflcXmtVTM
#           Open the album's playlist on YouTube (or YouTube Music) and copy each video's id.
#           Quote it — some ids start with "-" or look like numbers.
#   title   track title
#   feat    featured artist (optional)
#
# Some label videos refuse to play on 127.0.0.1 or other unusual hosts; open the
# site on your domain or on localhost.
#
# Album used here: SZA — SOS (2022), from this playlist:
#   https://www.youtube.com/playlist?list=PLf7ytxKzTZxvXeAH2MPmZO54Ej47Ol0Nc

