# The pinned, read-only "about me" note in Notes (also opened by About.txt on the desktop
# and printed by `cat Desktop/about.txt` in Terminal).
#   title    the note's title
#   bullets  one bullet per line; {posts} becomes the post count, {latest} the newest post's title
#
# 메모 앱(Dock 의 메모, 바탕의 About.txt)에 고정되어 있는 '📍about me' 메모.
# 방문자는 읽기만 한다(잠긴 메모). 고치려면 이 파일을 고친다.
# 줄마다 글머리 기호 한 줄. {posts} 는 글 수, {latest} 는 가장 최근 글 제목으로 바뀐다.
title: "📍about me"
bullets:
  - "안녕하세요, JaeJin 입니다 👋"
  - "백엔드와 컴퓨터 과학을 공부하고, 배운 것을 이 블로그 Ephemeris 에 기록합니다"
  - "주로 데이터베이스 · 네트워크 · 런타임 · 분산 시스템 · 운영에 대해 씁니다"
  - "지금까지 쓴 글 {posts}편 — 가장 최근 글은 「{latest}」"
  - "만든 것: 퍼필(독서 기록 앱) · Lucidus(디지털 명함) · xray(스크린샷) · moco(스터디 플랫폼)"
  - "‘왜’부터 이해하고, 한 줄로 설명할 수 있을 때까지 파고드는 걸 좋아합니다"
  - "GitHub: github.com/wlswo · RSS: wlswo.me/feed.xml"
