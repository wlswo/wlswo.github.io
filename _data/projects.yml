# Your projects, shown in order as app icons in the Games window (Dock) and listed
# under ~/Projects in Terminal.
#   name  label under the icon · desc  one-line description · url  opens in a new tab
#   icon  picture name: assets/images/apps/<icon>-128.png and <icon>-256.png (rounded-square app icon)
#   about true to also list it under Apps in the About window as a plain link (search engines can follow it;
#         the Games window is drawn by script, so its links are invisible to crawlers)
#
# Dock 의 '게임'을 누르면 뜨는 창에 앱 아이콘으로 서는 개인 프로젝트. 순서대로 놓인다.
#
# name  아이콘 밑의 이름
# desc  이름 밑의 한 줄 설명
# url   누르면 새 탭으로 여는 주소(마우스를 대면 창 아래 상태 막대에 뜬다)
# icon  assets/images/apps/<icon>-128.png · -256.png (둥근 사각형 앱 아이콘 그림)
# about true 면 About 창의 Apps 줄에도 일반 링크로 선다. 게임 창은 스크립트가 그려서
#       검색엔진이 링크를 못 따라가니, 검색에 걸려야 하는 앱 페이지는 true 로.

- name: 퍼필
  desc: 나만의 독서 기록앱
  url: https://wlswo.me/perfil/
  icon: perfil
  about: true

