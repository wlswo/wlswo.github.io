<div class="traffic" role="group" aria-label="Window controls">
  <button class="traffic__btn traffic__btn--close" type="button" data-window-action="close" aria-label="Close">{% include icon.html name="close" %}</button>
  <button class="traffic__btn traffic__btn--min" type="button" data-window-action="minimize" aria-label="Minimize">{% include icon.html name="minus" %}</button>
  {%- if include.nozoom %}
  <button class="traffic__btn traffic__btn--zoom" type="button" aria-label="Zoom" disabled>{% include icon.html name="zoom" %}</button>
  {%- else %}
  <button class="traffic__btn traffic__btn--zoom" type="button" data-window-action="zoom" aria-label="Zoom" aria-pressed="false">{% include icon.html name="zoom" %}</button>
  {%- endif %}
</div>
