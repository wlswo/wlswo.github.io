<!DOCTYPE html>
<html lang="{{ site.language | default: "en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}{% if site.subtitle and site.subtitle != "" %} - {{ site.subtitle }}{% endif %}</title>
  <meta property="og:image" content="{{ "/assets/images/thumbnail.png" | absolute_url }}" />
  <meta name="twitter:image" content="{{ "/assets/images/thumbnail.png" | absolute_url }}" />
  <link rel="icon" type="image/png" href="{{ "/assets/logo.ico/favicon-32x32.png" | relative_url }}" sizes="32x32" />
  <link rel="icon" type="image/png" href="{{ "/assets/logo.ico/favicon-16x16.png" | relative_url }}" sizes="16x16" />
  <link rel="shortcut icon" href="{{ "/assets/logo.ico/favicon.ico" | relative_url }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/logo.ico/apple-touch-icon.png" | relative_url }}" />
  <link rel="manifest" href="{{ "/assets/logo.ico/site.webmanifest" | relative_url }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  {% seo %}
</head>
<body>

    <main class="blog-index">
      <div class="scroll-line" aria-hidden="true"></div>

      <nav class="topnav">
        <a href="{{ '/' | relative_url }}" aria-current="page">Writing</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>

      <ul id="post-list" class="post-list">
        {%- comment -%}
          글은 전부 내보낸다. 몇 개씩 보여줄지는 화면 높이를 잰 뒤
          paginate.js 가 정한다. 스크립트가 없으면 전체가 그대로 보인다.
        {%- endcomment -%}
        {% for post in site.posts %}
          <li class="post-list__item">
            <a class="post-list__link" href="{{ post.url | relative_url }}">
              <span class="post-list__title">{{ post.title }}</span>
              <time class="post-list__date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%Y-%m-%d" }}</time>
            </a>
          </li>
        {% endfor %}
      </ul>

      <nav class="pagination" id="pagination" aria-label="글 목록 쪽 넘김"></nav>
      <script src="{{ "/assets/js/paginate.js" | relative_url }}" defer></script>

    </main>



</body>
</html>
